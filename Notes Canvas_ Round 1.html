<style>

header{position:relative;z-index:12}

function fl(){$('#fl').innerHTML=NM.map(a=>`<button class="${FA.has(a)?'on':''}" data-a="${a}"><span style="color:${AU[a]}">●</span> ${a}</button>`).join('')+'<span style="width:8px"></span>'+[['sticky','Sticky'],['doc','Document'],['torn','Torn']].map(([s,l])=>`<button class="${FS.has(s)?'on':''}" data-s="${s}">${l}</button>`).join('')}
$('#fl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const[T2,k]=b.dataset.a?[FA,b.dataset.a]:[FS,b.dataset.s];T2.has(k)?T2.delete(k):T2.add(k);fl();draw()};
function free(w,h,a){const cx=a?a.x+a.w+60:(vp.clientWidth/2-v.x)/v.k-w/2,cy=a?a.y:(vp.clientHeight/2-v.y)/v.k-h/2;for(let r=0;r<40;r++)for(let k=0;k<8;k++){const x=cx+Math.cos(k*.785)*r*45,y=cy+Math.sin(k*.785)*r*45;if(N.every(n=>x+w+16<n.x||x>n.x+n.w+16||y+h+16<n.y||y>n.y+n.h+16))return[x,y]}return[cx,cy]}
function mk(t,from,pos){const n={id:'n'+Date.now()+Math.random().toString(36).slice(2,5),t,s:'sticky',a:ME,ts:Date.now(),tint:'#2c3a31',r:+(Math.random()*4-2).toFixed(1),b:'New note. Click here and start writing.'};
const[x,y]=pos||free(190,70,from);n.x=x;n.y=y;mkCard(n);n.w=els[n.id].offsetWidth;n.h=els[n.id].offsetHeight;N.push(n);
if(from)L.push({f:from.id,t:n.id,label:'',dir:'one',c:0,dash:0});draw();toast(`Created “${t}”`+(from?' and linked it':''));if(!from)go(n)}
function openEd(n){cur=n;$('#app').classList.toggle('eo',!!n);if(!n){E.classList.remove('open');return}
if(!n.bl)n.bl=n.b.split('\n\n').map((t,i)=>({t:t.trim(),a:NM[(NM.indexOf(n.a)+i)%4]}));E.classList.add('open');rb()}
function rb(){const n=cur,ls=L.filter(l=>l.f==n.id||l.t==n.id).map(l=>by[l.f==n.id?l.t:l.f]);
E.innerHTML=`<div class=eh><span class=dot style="background:${AU[n.a]}"></span><b>${n.t}</b><button id=aub title="Show who wrote what">${E.classList.contains('au')?'Hide authors':'Authors'}</button><button id=x>✕</button></div><div class=meta>Linked notes</div><div class=chips>${ls.map(m=>`<button class=chip data-id="${m.id}">${m.t}</button>`).join('')||'<small>None yet</small>'}</div><div class=meta>by ${n.a} · ${ec[n.id]||0} edits</div><div class=doc>`+n.bl.map((b,i)=>{const k=n.lock&&n.lock.i==i;return `<p class="pg${k?' lock':''}" data-i="${i}" data-by="${b.a}" style="--au:${AU[b.a]};--lc:${k?AU[n.lock.by]:''}">${k?`<span class=tag>${n.lock.by} is editing…</span>`:''}${md(b.t)}</p>`}).join('')+`</div><div class=row><button id=lkb>${n.lock?'Release lock':'Simulate Jess editing'}</button></div>`}
E.onclick=e=>{const t=e.target;if(t.id=='aub'){E.classList.toggle('au');return rb()}if(t.id=='x')return pick(null);if(t.id=='lkb')return setLock(cur,!cur.lock);if(t.classList.contains('chip'))return go(by[t.dataset.id]);const b=t.closest('.pg');if(b&&!b.querySelector('textarea'))editBlk(b)};
function setLock(n,on){n.lock=on?{i:Math.min(1,n.bl.length-1),by:'Jess'}:null;const e=els[n.id];if(e){e.classList.toggle('locked',on);e.style.setProperty('--lc',AU.Jess);e.querySelector('.lk').textContent='✎ Jess'}rb()}
function editBlk(b){const i=+b.dataset.i,k=cur.bl[i];if(cur.lock&&cur.lock.i==i)return toast(cur.lock.by+' is editing this block');
b.classList.add('lock');b.style.setProperty('--lc',AU[ME]);b.innerHTML='<span class=tag>You’re editing</span><textarea></textarea>';const t=b.querySelector('textarea');t.value=k.t;t.focus();
t.onkeydown=e=>{if(e.key=='Escape')t.blur()};
t.onblur=()=>{t.onblur=null;const x=t.value.trim()||k.t,d=Math.min(2000,Math.max(0,x.length-k.t.length));k.t=x;if(d)k.a=ME;cur.b=cur.bl.map(y=>y.t).join(' ');const el=els[cur.id];if(el){el.querySelector('p').textContent=cur.b;cur.w=el.offsetWidth;cur.h=el.offsetHeight;draw()}ec[cur.id]=(ec[cur.id]||0)+1;cur.ts=Date.now();S[ME]+=d;(x.match(/\[\[(.+?)\]\]/g)||[]).forEach(m=>{const t2=m.slice(2,-2).split('|')[0].trim();if(t2&&!all.some(o=>o.t.toLowerCase()==t2.toLowerCase()))mk(t2,cur)});toast(`Saved · +${d} characters for ${ME}`);rb()}}
function stats(){const mx=Math.max(...Object.values(S)),top=NM.slice().sort((a,b)=>S[b]-S[a]),deg=n=>L.filter(l=>l.f==n.id||l.t==n.id).length,ml=N.slice().sort((a,b)=>deg(b)-deg(a))[0],me=Object.entries(ec).sort((a,b)=>b[1]-a[1])[0];
$('#st').innerHTML=`<div class=sc><div class=eh><b>Journal stats</b><button id=sx>✕</button></div><div class=meta>MVP · characters written</div>`+top.map((a,i)=>`<div class=bar><span>${i?'':'★ '}${a}</span><div><i style="width:${S[a]/mx*100}%;background:${AU[a]}"></i></div><em>${S[a]}</em></div>`).join('')+`<div class=meta>Notes created · links drawn</div>`+NM.map(a=>`<div class=bar><span>${a}</span><small>${all.filter(n=>n.a==a).length} notes · ${L.filter(l=>by[l.f].a==a).length} links</small></div>`).join('')+`<div class=meta>Most linked note</div>${ml.t} (${deg(ml)} links)<div class=meta>Most edited note</div>${by[me[0]].t} (${me[1]} edits)</div>`;$('#st').classList.add('on')}
$('#sb').onclick=stats;$('#st').onclick=e=>{if(e.target.id=='st'||e.target.id=='sx')$('#st').classList.remove('on')};
document.querySelectorAll('.gut').forEach(g=>g.onpointerdown=e=>{g.setPointerCapture(e.pointerId);const l=g.id=='g1',x0=e.clientX,w0=(l?D:E).offsetWidth;g.onpointermove=ev=>{const w=Math.min(560,Math.max(160,w0+(l?1:-1)*(ev.clientX-x0)));$('#app').style.setProperty(l?'--dw':'--ew',w+'px')};g.onpointerup=()=>{g.onpointermove=null}});
function pickL(i){sl=i;pick(null);if(i===null){TB.style.display='none';draw();return}const l=L[i];TB.style.display='flex';
$('#lbl').value=l.label;$('#dir').textContent={none:'—',one:'→',two:'↔'}[l.dir];$('#dash').textContent=l.dash?'┄┄':'──';
[...$('#sws').children].forEach((b,j)=>b.classList.toggle('on',j==l.c));draw();place()}
LC.forEach((c,i)=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.onclick=()=>{L[sl].c=i;pickL(sl)};$('#sws').appendChild(b)});
$('#lbl').oninput=e=>{L[sl].label=e.target.value;draw()};
$('#dir').onclick=()=>{const l=L[sl];l.dir={none:'one',one:'two',two:'none'}[l.dir];pickL(sl)};
$('#dash').onclick=()=>{L[sl].dash=!L[sl].dash;pickL(sl)};
$('#del').onclick=()=>{L.splice(sl,1);pickL(null)};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();draw();hi=0;sw()};
$('#pv').onclick=e=>{mode=mode=='full'?'lines':'full';e.target.textContent='Preview: '+(mode=='full'?'full':'first lines');tip(sel)};
const P=new Map();let drag=null,pan=null,pinch=null,rs=null,moved=0;
vp.addEventListener('pointerdown',e=>{if(e.target.closest('#tb'))return;vp.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
if(P.size==2){drag=pan=null;const[a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:v.k};return}
if(e.target.classList.contains('rz')){const n=by[e.target.parentNode.dataset.id];tip(null);rs={n,sx:e.clientX,sy:e.clientY,ow:n.w,oh:n.h};return}
const c=e.target.closest('.card');tip(null);
if(c){const n=by[c.dataset.id];drag={n,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y}}
else pan={sx:e.clientX,sy:e.clientY,vx:v.x,vy:v.y,li:e.target.dataset?.i??null}});
vp.addEventListener('pointermove',e=>{if(!P.has(e.pointerId)){if(e.pointerType=='mouse'){const c=e.target.closest('.card');tip(c?by[c.dataset.id]:sel)}return}
const p=P.get(e.pointerId);p.x=e.clientX;p.y=e.clientY;
if(pinch&&P.size==2){const[a,b]=[...P.values()];zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);return}
const g=drag||pan||rs;if(!g)return;const dx=e.clientX-g.sx,dy=e.clientY-g.sy;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
if(rs){const n=rs.n,el=els[n.id];n.w=Math.max(130,rs.ow+dx/v.k);n.h=Math.max(80,rs.oh+dy/v.k);el.classList.add('fix');el.style.width=n.w+'px';el.style.height=n.h+'px';draw()}else if(drag){drag.n.x=drag.ox+dx/v.k;drag.n.y=drag.oy+dy/v.k;els[drag.n.id].style.left=drag.n.x+'px';els[drag.n.id].style.top=drag.n.y+'px';draw()}
else if(moved>4){v.x=pan.vx+dx;v.y=pan.vy+dy;apply()}});
const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);if(P.size<2)pinch=null;
if(drag&&moved<5)pick(drag.n===sel?null:drag.n);else if(pan&&moved<5){pan.li!==null?pickL(+pan.li):(pickL(null),pick(null))}
drag=pan=rs=null};
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
vp.addEventListener('dblclick',e=>{if(!e.target.classList.contains('rz')){if(e.target===vp){const b=vp.getBoundingClientRect();mk('Untitled',null,[(e.clientX-b.left-v.x)/v.k-95,(e.clientY-b.top-v.y)/v.k-30])}return}const el=e.target.parentNode,n=by[el.dataset.id];el.classList.remove('fix');el.style.width=el.style.height='';n.w=el.offsetWidth;n.h=el.offsetHeight;draw()});
vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,v.k*Math.exp(-e.deltaY*.0015))},{passive:false});
const b=vp.getBoundingClientRect(),x0=Math.min(...N.map(n=>n.x)),x1=Math.max(...N.map(n=>n.x+n.w)),y0=Math.min(...N.map(n=>n.y)),y1=Math.max(...N.map(n=>n.y+n.h));
v.k=Math.max(.3,Math.min(1,b.width/(x1-x0+100),b.height/(y1-y0+100)));v.x=(b.width-(x1-x0)*v.k)/2-x0*v.k;v.y=(b.height-(y1-y0)*v.k)/2-y0*v.k;
fl();draw();apply();
</script></body></html>
