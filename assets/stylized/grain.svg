<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Paper tooth only: much finer and fainter than the cork so the board texture never
       reads through the notes. Multiplied over the paper colour. -->
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.45 0.9" numOctaves="2" seed="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.34  0 0 0 0 0.22  0 0 0 0.5 -0.17"/>
    </filter>
  </defs>
  <rect width="200" height="200" filter="url(#paper-grain)"/>
</svg>
