<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <filter id="cork-coarse" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.22  0 0 0 0 0.11  0 0 0 1.4 -0.4"/>
    </filter>
    <filter id="cork-fine" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.08  0 0 0 0 0.03  0 0 0 1.6 -0.55"/>
    </filter>
    <filter id="cork-fleck" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.72  0 0 0 0 0.5  0 0 0 0 0.3  0 0 0 2.4 -1.2"/>
    </filter>
  </defs>
  <rect width="320" height="320" fill="#7b5233"/>
  <rect width="320" height="320" filter="url(#cork-coarse)"/>
  <rect width="320" height="320" filter="url(#cork-fine)"/>
  <rect width="320" height="320" filter="url(#cork-fleck)"/>
</svg>
