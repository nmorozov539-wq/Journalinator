name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify tag matches module version
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('module.json', 'utf8')).version")"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Check script syntax
        run: npm run check

      - name: Build Foundry package
        shell: bash
        run: |
          package="fvtt-journalinator-${GITHUB_REF_NAME}.zip"
          mkdir -p dist/fvtt-journalinator
          cp -R module.json LICENSE README.md lang scripts styles dist/fvtt-journalinator/
          cp module.json dist/module.json
          cd dist
          zip -9 -r "${package}" fvtt-journalinator

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/module.json#Foundry VTT manifest" \
            "dist/fvtt-journalinator-${GITHUB_REF_NAME}.zip#Ready-to-install module" \
            --title "Journalinator ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
